<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a22"/>
      <stop offset="1" stop-color="#06070a"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#4fd1c5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f28"/>
      <stop offset="1" stop-color="#101217"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#4fd1c5" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="tileClip"><rect width="256" height="256" rx="56"/></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- tile -->
  <g clip-path="url(#tileClip)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <rect width="256" height="256" fill="url(#grid)"/>
    <rect width="256" height="256" fill="url(#aura)"/>
  </g>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2a2e37" stroke-width="3"/>
  <path d="M56 2.5H200" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

  <!-- document: neon edge, folded corner -->
  <path id="doc" d="M78 26H164L186 48V158Q186 166 178 166H78Q70 166 70 158V34Q70 26 78 26Z"
        fill="none" stroke="#4fd1c5" stroke-width="6" filter="url(#glow)" opacity="0.8"/>
  <path d="M78 26H164L186 48V158Q186 166 178 166H78Q70 166 70 158V34Q70 26 78 26Z"
        fill="url(#sheet)" stroke="#4fd1c5" stroke-width="3" stroke-linejoin="round"/>
  <path d="M164 26V42Q164 48 170 48H186Z" fill="#4fd1c5" fill-opacity="0.35" stroke="#4fd1c5" stroke-width="3" stroke-linejoin="round"/>

  <!-- title + subtitle -->
  <rect x="84" y="38" width="62" height="8" rx="2" fill="#e8ebef"/>
  <rect x="84" y="51" width="42" height="4" rx="2" fill="#7a8090"/>

  <!-- bordered table: teal header, three classified rows -->
  <rect x="84" y="62" width="88" height="15" fill="#4fd1c5"/>
  <g fill="none" stroke="#4fd1c5" stroke-width="2" stroke-opacity="0.65">
    <rect x="84" y="62" width="88" height="90"/>
    <path d="M84 77H172M84 102H172M84 127H172M106 62V152M140 62V152"/>
  </g>
  <rect x="110" y="83" width="3.5" height="13" rx="1" fill="#4fd1c5"/>
  <rect x="110" y="108" width="3.5" height="13" rx="1" fill="#d4a94a"/>
  <rect x="110" y="133" width="3.5" height="13" rx="1" fill="#e07070"/>
  <g fill="#7a8090">
    <rect x="89" y="87" width="12" height="3" rx="1.5"/>
    <rect x="89" y="112" width="12" height="3" rx="1.5"/>
    <rect x="89" y="137" width="12" height="3" rx="1.5"/>
    <rect x="118" y="85" width="17" height="3" rx="1.5" fill="#e8ebef"/>
    <rect x="118" y="110" width="14" height="3" rx="1.5" fill="#e8ebef"/>
    <rect x="118" y="135" width="17" height="3" rx="1.5" fill="#e8ebef"/>
    <rect x="145" y="85" width="22" height="3" rx="1.5"/>
    <rect x="145" y="91" width="15" height="3" rx="1.5"/>
    <rect x="145" y="110" width="20" height="3" rx="1.5"/>
    <rect x="145" y="135" width="22" height="3" rx="1.5"/>
    <rect x="145" y="141" width="12" height="3" rx="1.5"/>
  </g>

  <!-- neon CDF monogram (paths, no font dependency) -->
  <g id="mono" fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <g stroke="#4fd1c5" stroke-width="14" filter="url(#glow)" opacity="0.9">
      <path d="M88 186H70L60 196V212L70 222H88"/>
      <path d="M114 186H132L142 196V212L132 222H114Z"/>
      <path d="M196 186H178L168 196V222M168 204H190"/>
    </g>
    <g stroke="#4fd1c5" stroke-width="12">
      <path d="M88 186H70L60 196V212L70 222H88"/>
      <path d="M114 186H132L142 196V212L132 222H114Z"/>
      <path d="M196 186H178L168 196V222M168 204H190"/>
    </g>
    <g stroke="#e6fffc" stroke-width="3.5" filter="url(#softglow)" opacity="0.9">
      <path d="M88 186H70L60 196V212L70 222H88"/>
      <path d="M114 186H132L142 196V212L132 222H114Z"/>
      <path d="M196 186H178L168 196V222M168 204H190"/>
    </g>
  </g>
</svg>
